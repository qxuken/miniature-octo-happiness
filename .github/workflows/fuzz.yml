name: Bounded fuzzing
on:
  push:
    paths:
      - 'src/**'
      - 'crates/**'
      - 'apps/**'
      - 'examples/support/**'
      - 'tests/support/**'
      - 'fuzz/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'tools/fuzz.py'
      - 'tools/test_fuzz_runner.py'
      - '.github/workflows/fuzz.yml'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * 1'
permissions:
  contents: read
jobs:
  address:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: python3 tools/test_fuzz_runner.py
      - name: Replay committed seeds and model regressions
        run: cargo +1.99.1 test --locked --manifest-path fuzz/Cargo.toml --lib
      - name: Run all manifest targets
        env:
          FUZZ_RUNS: ${{ github.event_name == 'schedule' && '100000' || '1000' }}
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '120' || '20' }}
        run: python3 tools/fuzz.py --runs "$FUZZ_RUNS" --seconds "$FUZZ_SECONDS" --output target/fuzz-evidence/ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuzz-evidence-${{ github.run_id }}
          path: target/fuzz-evidence/
          if-no-files-found: warn
