name: Engine checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: rustup override set 1.99.1
      - run: cargo fetch --locked
      - name: Verify frozen typed schema rollout and rollback on NTFS
        if: runner.os == 'Windows'
        id: windows_typed_schema
        continue-on-error: true
        shell: pwsh
        run: |
          $historical = '1ca5e5ab63a2772f679c7186e2d84fba3ac0a534'
          $current = '6cc8ef3e60dcf406a272e3f176e83d3c5c83190a'
          git fetch --no-tags --depth=1 origin $historical $current
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo xtask compatibility --profile typed --historical $historical --current $current --output target/windows-typed-schema
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save Windows typed schema rollout evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: weekend-db-windows-typed-schema-${{ runner.arch }}
          if-no-files-found: warn
          path: |
            target/windows-typed-schema/**
            !target/windows-typed-schema/source/**
            !target/windows-typed-schema/build/**
      - name: Qualify the private Windows package and relocation
        if: runner.os == 'Windows'
        run: cargo xtask package --output target/private-package --features crdt,replication
      - name: Verify Windows exact-DLL publication failures and reopening
        if: runner.os == 'Windows'
        id: delivered_windows_faults
        continue-on-error: true
        shell: pwsh
        run: |
          $pin = (Get-FileHash target/private-package/manifest.json -Algorithm SHA256).Hash.ToLowerInvariant()
          cargo xtask windows-faults --package target/private-package --manifest-sha256 $pin --output target/private-windows-faults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save Windows exact-DLL fault evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: weekend-db-windows-faults-${{ runner.arch }}
          if-no-files-found: warn
          path: target/private-windows-faults/
      - name: Verify real NTFS disk exhaustion and recovery against the exact DLL
        if: runner.os == 'Windows'
        id: delivered_windows_disk_full
        continue-on-error: true
        shell: pwsh
        run: |
          $pin = (Get-FileHash target/private-package/manifest.json -Algorithm SHA256).Hash.ToLowerInvariant()
          cargo xtask windows-disk-full --package target/private-package --manifest-sha256 $pin --output target/private-windows-disk-full
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save Windows NTFS exhaustion evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: weekend-db-windows-disk-full-${{ runner.arch }}
          if-no-files-found: warn
          path: target/private-windows-disk-full/
      - name: Verify actual NTFS owner quota, fresh reopen and retry
        if: runner.os == 'Windows'
        id: windows_quota
        continue-on-error: true
        shell: pwsh
        env:
          WEEKEND_DB_SOURCE_ID: ${{ github.sha }}
        run: |
          cargo build --offline --locked --release -p weekend-db --example native_quota --target-dir target/windows-quota-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo xtask windows-quota --fixture target/windows-quota-build/release/examples/native_quota.exe --source $env:WEEKEND_DB_SOURCE_ID --output target/windows-quota
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save NTFS owner quota evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: weekend-db-windows-quota-${{ runner.arch }}
          if-no-files-found: warn
          path: target/windows-quota/
      - name: Verify near-cap Windows backup, restore and compact-copy exhaustion
        if: runner.os == 'Windows'
        id: windows_maintenance_space
        continue-on-error: true
        shell: pwsh
        env:
          WEEKEND_DB_SOURCE_ID: ${{ github.sha }}
        run: |
          cargo build --offline --locked --release --manifest-path tools/resource-envelope/Cargo.toml --features compound --bin weekend-compound-resource --target-dir target/maintenance-win-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo xtask windows-maintenance-space --fixture target/maintenance-win-build/release/weekend-compound-resource.exe --source $env:WEEKEND_DB_SOURCE_ID --output target/windows-maintenance-space
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save Windows maintenance exhaustion evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: weekend-db-windows-maintenance-space-${{ runner.arch }}
          if-no-files-found: warn
          path: target/windows-maintenance-space/
      - name: Verify near-cap macOS backup, restore and compaction exhaustion
        if: runner.os == 'macOS'
        id: macos_maintenance_space
        continue-on-error: true
        env:
          WEEKEND_DB_SOURCE_ID: ${{ github.sha }}
        run: |
          cargo build --offline --locked --release --manifest-path tools/resource-envelope/Cargo.toml --features compound --bin weekend-compound-resource --target-dir target/maintenance-mac-build
          cargo xtask macos-maintenance-space --fixture target/maintenance-mac-build/release/weekend-compound-resource --source "$WEEKEND_DB_SOURCE_ID" --output target/macos-maintenance-space
      - name: Save macOS maintenance exhaustion evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: weekend-db-macos-maintenance-space-${{ runner.arch }}
          if-no-files-found: warn
          path: target/macos-maintenance-space/
      - name: Release configuration validation
        run: |
          cargo test --offline --locked -p xtask --bin xtask
      - name: Rust debug/release and interruption checks; C consumers on macOS/Linux
        run: cargo xtask check --skip-odin
      - name: Compile Windows C and C++ consumers against both DLL builds
        if: runner.os == 'Windows'
        run: |
          cargo xtask windows-consumers --library target/debug/weekend_db.dll
          cargo xtask windows-consumers --library target/release/weekend_db.dll
      - name: Qualify private native package and relocation (no publication)
        if: runner.os != 'Windows'
        run: cargo xtask package --output target/private-package --features crdt,replication
      - name: Verify native macOS publication faults and actual APFS exhaustion against the exact dylib
        if: runner.os == 'macOS'
        run: cargo xtask faults delivered --macos --apfs-full --package target/private-package --output target/private-macos-faults
      - name: Save macOS exact-dylib fault evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: weekend-db-macos-faults-${{ runner.arch }}
          if-no-files-found: warn
          path: target/private-macos-faults/
      - name: Verify all 20 Windows C/C++ cases against the exact delivered DLL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pin = (Get-FileHash target/private-package/manifest.json -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "Delivered manifest SHA-256: $pin"
          cargo xtask windows-trace --package target/private-package --manifest-sha256 $pin --output target/private-windows-trace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save Windows exact-DLL trace evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: weekend-db-windows-trace-${{ runner.arch }}
          if-no-files-found: warn
          path: target/private-windows-trace/
      - name: Save native private package evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekend-db-private-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: warn
          path: target/private-package/
      - name: Save release shared library and C header
        uses: actions/upload-artifact@v7
        with:
          name: weekend-db-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            target/release/*.dylib
            target/release/*.so
            target/release/*.dll
            target/release/*.dll.lib
            include/weekend_db.h
      - name: Enforce the Windows fault and compatibility results
        if: always() && runner.os == 'Windows' && (steps.windows_typed_schema.outcome == 'failure' || steps.delivered_windows_faults.outcome == 'failure' || steps.delivered_windows_disk_full.outcome == 'failure' || steps.windows_quota.outcome == 'failure' || steps.windows_maintenance_space.outcome == 'failure')
        shell: pwsh
        run: exit 1
      - name: Enforce the macOS maintenance fault result
        if: always() && runner.os == 'macOS' && steps.macos_maintenance_space.outcome == 'failure'
        run: exit 1
  helper-controls:
    name: POSIX qualification helper controls
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust and cache the locked dependencies
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
          cargo fetch --locked
          cargo fetch --locked --manifest-path tools/sqlite-baseline/Cargo.toml
      - name: Ensure system SQLite is available
        run: |
          if [ "$RUNNER_OS" = Linux ] && ! pkg-config --exists sqlite3; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends libsqlite3-dev pkg-config
          fi
      - name: Run and verify all registered debug and release helper controls
        run: cargo xtask helper-controls --output target/helper-controls
      - name: Save private helper-control evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: helper-controls-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: warn
          path: |
            target/helper-controls/
            !target/helper-controls/cargo-target/**
  linux-quota:
    name: Native Linux quota exhaustion and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WEEKEND_DB_SOURCE_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Install filesystem quota tools and record their versions
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends quota e2fsprogs util-linux
          mkdir -p target/quota-host
          uname -a > target/quota-host/kernel.txt
          dpkg-query -W quota e2fsprogs util-linux > target/quota-host/packages.txt
          cat /etc/os-release > target/quota-host/os-release.txt
      - name: Build the private Rust quota controller without privileges
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
          cargo fetch --locked
          cargo build --offline --locked -p xtask --release --target-dir target/xtask
          sha256sum target/xtask/release/xtask > target/quota-host/xtask.sha256
      - name: Check controller rejection and cleanup controls without privileges
        run: |
          cargo test --offline --locked -p xtask --bin xtask quota
          cargo test --offline --locked -p xtask --bin xtask resource_oracle
      - name: Build the native core-only quota fixture
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 fetch --locked
          cargo +1.99.1 build --offline --locked --release --example native_quota --target-dir target/quota-build
          rustc +1.99.1 -Vv > target/quota-host/rustc.txt
          sha256sum target/quota-build/release/examples/native_quota > target/quota-host/fixture.sha256
      - name: Calibrate actual EDQUOT and verify commit failure, reopening and retry
        run: |
          sudo "$PWD/target/xtask/release/xtask" quota --fixture "$PWD/target/quota-build/release/examples/native_quota" --source "${{ github.sha }}" --output "$PWD/target/native-quota"
          sudo jq -ce 'select(.verified) | {source: .source_binding.source, calibrated_errno: .calibration_full.errno, revisions: [.results[] | .current_revision], cleanup: .cleanup.verified}' target/native-quota/evidence.json
          sudo sha256sum target/native-quota/evidence.json
      - name: Build the near-cap maintenance fixture
        run: |
          cargo +1.99.1 build --offline --locked --release --manifest-path tools/resource-envelope/Cargo.toml --features compound --bin weekend-compound-resource --target-dir target/maintenance-quota-build
          sha256sum target/maintenance-quota-build/release/weekend-compound-resource > target/quota-host/maintenance-fixture.sha256
      - name: Verify maintenance EDQUOT, full-space reopen and retry
        run: |
          sudo "$PWD/target/xtask/release/xtask" quota --maintenance --fixture "$PWD/target/maintenance-quota-build/release/weekend-compound-resource" --source "${{ github.sha }}" --output "$PWD/target/maintenance-quota"
          sudo jq -ce 'select(.verified) | {source: .source_binding.source, cases: [.maintenance_cases[] | {operation, errno: .failure.raw, bytes: .failure.partial_bytes}], reopened: [.maintenance_records[] | select(.label == "advanced-source" or .label == "final-backup") | .rows[0].revision], cleanup: .cleanup.verified}' target/maintenance-quota/evidence.json
          sudo sha256sum target/maintenance-quota/evidence.json
      - name: Transfer private evidence ownership for upload
        if: always()
        run: |
          if test -d target/native-quota; then
            sudo chown -R --reference=. target/native-quota
          fi
          if test -d target/maintenance-quota; then
            sudo chown -R --reference=. target/maintenance-quota
          fi
      - name: Save quota test evidence (no crate or container publication)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-quota-${{ runner.arch }}
          if-no-files-found: warn
          path: |
            target/native-quota/
            target/quota-host/
            target/maintenance-quota/
            target/maintenance-quota-build/release/weekend-compound-resource
            target/quota-build/release/examples/native_quota
  sanitizers:
    runs-on: macos-latest
    timeout-minutes: ${{ matrix.kind == 'thread' && 40 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        kind: [address, thread]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: rustup toolchain install nightly --profile minimal --component rust-src
      - run: cargo +1.99.1 fetch --locked
      - run: cargo +1.99.1 xtask sanitizers ${{ matrix.kind }}
      - name: Save bounded sanitizer diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workspace-sanitizer-${{ matrix.kind }}
          path: |
            target/sanitizer-${{ matrix.kind }}-evidence/*.json
            target/sanitizer-${{ matrix.kind }}-evidence/*.log
          if-no-files-found: warn
  c-address:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: rustup toolchain install nightly --profile minimal --component rust-src
      - run: cargo +1.99.1 fetch --locked
      - run: cargo +1.99.1 xtask c-sanitizers
      - name: Bounded atomic models and fail-required controls
        env:
          MODEL_TOOLCHAIN: nightly
        run: cargo +1.99.1 xtask atomic-model
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: c-rust-address-sanitizer
          if-no-files-found: warn
          path: |
            target/c-sanitizer-evidence/*.json
            target/c-sanitizer-evidence/*.log
            target/c-sanitizer-evidence/calibration.*
            target/atomic-model-evidence/*.json
            target/atomic-model-evidence/*.log
  coverage:
    name: Engine library coverage
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99.1 --profile minimal --component llvm-tools-preview
      - run: rustup override set 1.99.1
      - run: cargo fetch --locked
      - run: cargo +1.99.1 xtask coverage --scope library --toolchain 1.99.1 --output target/coverage-library
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-core-library-coverage
          if-no-files-found: error
          path: |
            target/coverage-library/evidence.json
            target/coverage-library/*.log
            target/coverage-library/*.process.json
            target/coverage-library/report.txt
            target/coverage-library/html/
