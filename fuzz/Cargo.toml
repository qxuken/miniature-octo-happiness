[package]
name = "weekend-db-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
weekend-db = { path = "..", features = ["crdt", "replication"] }

weekend-db-typed = { path = "../crates/weekend-db-typed" }
proc-macro2 = "=1.0.107"
quote = "=1.0.47"
syn = { version = "=2.0.119", features = ["full"] }

[workspace]
members = ["."]

[[bin]]
name = "open_image_bytes"
path = "fuzz_targets/open_image_bytes.rs"
test = false
doc = false
bench = false

