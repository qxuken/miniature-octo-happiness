[package]
name = "weekend-db-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
weekend-db = { path = "..", features = ["crdt", "replication"] }

[workspace]
members = ["."]

