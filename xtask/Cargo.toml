[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dunce = "1.0.5"
serde_json = "1.0.154"
sha2 = "0.10.9"
serde = { version = "1.0.228", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
signal-hook = "0.4.5"
