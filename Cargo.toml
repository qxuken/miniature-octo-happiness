[package]
name = "weekend-db"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]
members = ["crates/weekend-db-typed", "crates/weekend-db-macros", "apps/weekend-tasks", "apps/study-peer", "apps/write-coordinator"]
default-members = [".", "crates/weekend-db-typed", "crates/weekend-db-macros", "apps/weekend-tasks"]
resolver = "3"
exclude = ["probe/rust", "fuzz"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
crdt = ["dep:weekend-db-macros"]
fault-injection = []
replication = ["dep:sha2"]

[dependencies]
sha2 = { version = "0.10.9", default-features = false, optional = true }
weekend-db-macros = { path = "crates/weekend-db-macros", optional = true }

[[bin]]
name = "benchmark"
path = "tools/benchmark.rs"

[[bin]]
name = "file-worker"
path = "tools/file_worker.rs"
required-features = ["fault-injection"]

[[example]]
name = "study_progress"
required-features = ["crdt"]

[profile.release]
overflow-checks = true
