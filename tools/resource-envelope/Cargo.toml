[package]
name = "weekend-resource-envelope"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
weekend-db = { path = "../.." }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[features]
compound = ["weekend-db/fault-injection"]

[[bin]]
name = "weekend-compound-resource"
path = "src/compound.rs"
required-features = ["compound"]

[profile.release]
overflow-checks = true
