[package]
name = "weekend-replicate"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT OR Apache-2.0"

[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
weekend-db = { path = "../..", features = ["replication"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinSock"] }

[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dev-dependencies]
sha2 = "0.10.9"
